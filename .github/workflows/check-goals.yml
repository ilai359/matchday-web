name: Check for goals

# Vercel's free plan only allows background jobs ("cron jobs") to run
# once a day, which is far too slow for a goal alert to feel like an
# alert. GitHub Actions' scheduled workflows are free and can run every
# few minutes instead, so this is what actually triggers the app's
# goal-check job on a real schedule - see
# src/app/api/cron/check-goals/route.ts for what that job does.
#
# One-time setup this needs (see NOTES.md for the full writeup):
#   1. A repository secret named GOALS_CRON_SECRET, set to the same
#      value as the GOALS_CRON_SECRET environment variable in Vercel.
#   2. The app's own GOALS_CRON_SECRET, VAPID_PUBLIC_KEY,
#      VAPID_PRIVATE_KEY, VAPID_SUBJECT, and NEXT_PUBLIC_VAPID_PUBLIC_KEY
#      environment variables set in Vercel.
#
# GitHub's own docs note that scheduled workflows run on a "best effort"
# basis and can be delayed by a few minutes during busy periods, and are
# automatically disabled if the repository goes 60 days with no commits
# at all (a manual run, or any new push, re-enables it). Fine for a goal
# alert - a few minutes' delay is a minor tradeoff for this being free.
# The schedule now runs from cron-job.org (every 5 minutes, reliably).
# GitHub's own schedule is turned off so the check doesn't run twice;
# this can still be run by hand from the Actions tab.
on:
  workflow_dispatch: {}

jobs:
  check-goals:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the check-goals endpoint
        # The route itself (src/app/api/cron/check-goals/route.ts)
        # always returns 200 now, even when something inside it goes
        # wrong - the actual outcome is in the JSON body's "ok" field.
        # That's deliberate: `curl --fail` throws away the response BODY
        # on any non-2xx status, which used to mean every failure here
        # showed up as a bare, unexplained "500" with no way to see why.
        # This prints the body unconditionally (so a real problem is
        # still visible in this log), and only fails the step - which
        # is what triggers GitHub's "workflow failed" email - on an
        # actual HTTP-level failure (wrong/missing secret -> 401, or
        # something going wrong before the route's own code even runs).
        run: |
          response=$(curl --silent --show-error -w '\nHTTP_STATUS:%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.GOALS_CRON_SECRET }}" \
            "https://matchday-web-zeta.vercel.app/api/cron/check-goals")
          http_status=$(echo "$response" | tail -n1 | cut -d: -f2)
          body=$(echo "$response" | sed '$d')
          echo "$body"
          echo "HTTP status: $http_status"
          if [ "$http_status" -ge 400 ]; then
            echo "::error::Request failed with HTTP $http_status"
            exit 1
          fi
